# Đặt file này tại: <APPS_ROOT>/_proxy/sites/smartspend.conf (Nginx)
# Thay smartspend.tenmiencuaban.com bằng subdomain thực tế trùng với SMARTSPEND_PUBLIC_URL

server {
    listen 80;
    server_name smartspend.tenmiencuaban.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smartspend.tenmiencuaban.com;

    # Chứng chỉ SSL (Let's Encrypt / Cloudflare Origin Cert)
    # ssl_certificate     /etc/letsencrypt/live/smartspend.tenmiencuaban.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/smartspend.tenmiencuaban.com/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chặn giả mạo CF-Connecting-IP khi mở trực tiếp qua Nginx (xóa dòng này nếu đi sau Cloudflare Proxy)
        proxy_set_header CF-Connecting-IP "";

        # Giữ kết nối đủ dài (120s) cho yêu cầu Gemini AI lập thực đơn tuần / AI Coach (tối đa 90s)
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
