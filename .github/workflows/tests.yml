name: Application checks
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: smartspend_accounts_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d smartspend_accounts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SMARTSPEND_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:disposable-ci-password@127.0.0.1:5432/smartspend_accounts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run build:css
      - run: node tests/test_private_cache.cjs
      - run: node tests/test_iphone_qr.cjs
      - run: node tests/test_cashflow_chart.cjs
      - run: node tests/test_plan_sync.cjs
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: .\build_exe.bat --no-pause
